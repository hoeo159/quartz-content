name: Rebuild Quartz site

# The notes live here, but the site is built from hoeo159/quartz. Tell that
# repository to rebuild whenever notes change.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy in hoeo159/quartz
        env:
          # Fine-grained PAT with "Contents: read and write" on hoeo159/quartz.
          TOKEN: ${{ secrets.QUARTZ_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hoeo159/quartz/dispatches \
            -d '{"event_type":"content-updated"}'
